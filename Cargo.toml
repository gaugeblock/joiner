[workspace]
resolver = "3"
members = [
    ".",
    "crates/*",
]

[workspace.package]
version = "0.1.0-beta.3"
edition = "2024"
authors = ["Colin Wolff <1562545+colinwolff@users.noreply.github.com>"]
license = "Apache-2.0"
repository = "https://github.com/gaugeblock/joiner"
homepage = "https://gaugeblock.dev"
readme = "README.md"
keywords = ["ast", "neurosymbolic", "codegen", "llm", "compiler"]
categories = ["development-tools", "compilers", "command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[package]
name = "joiner"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Master neurosymbolic synthesis orchestrator for the gaugeblock suite"

[dependencies]
joiner-core = { path = "crates/joiner-core", version = "0.1.0-beta.3" }

[dev-dependencies]
dado-core = "0.1.0-beta.2"
sawhorse-core = "0.1.0-beta.2"
storypole-core = "0.1.0-beta.2"
tempfile = "3.10"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "sync"] }
uuid = { version = "1.10", features = ["v4"] }

[lints]
workspace = true

[profile.dev]
opt-level = 0
debug = 1

[profile.test]
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.test.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
