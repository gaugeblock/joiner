[package]
name = "joiner-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface and daemon for joiner"

[[bin]]
name = "joiner"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
joiner-core = { path = "../joiner-core", version = "0.1.0-beta.1" }
joiner-mcp = { path = "../joiner-mcp", version = "0.1.0-beta.1" }
dado-core = "0.1.0-beta.1"
sawhorse-core = "0.1.0-beta.1"
storypole-core = "0.1.0-beta.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
tempfile = "3.10"

