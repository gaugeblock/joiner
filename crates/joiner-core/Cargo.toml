[package]
name = "joiner-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core orchestration loop, System 1 router, hole filler, and verifier for joiner"

[lints]
workspace = true

[dependencies]
miter-engine = "0.1.0-alpha.3"
miter-harness = "0.1.0-alpha.3"
storypole-core = "0.1.0-beta.2"
sawhorse-core = "0.1.0-beta.2"
chalkline-core = "0.1.0-beta.2"
dado-core = "0.1.0-beta.2"
batten-core = "0.1.0-beta.2"

async-trait = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["sync", "time", "rt", "macros", "fs"] }
tracing = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.10"

